name: Standalone build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install standalone dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libeigen3-dev libnlopt-cxx-dev liburdfdom-dev swig python3-dev python3-pip
          python3 -m pip install "pin==3.9.0"
          echo "CMAKE_PREFIX_PATH=$(python3 -c 'import cmeel; from pathlib import Path; print(Path(cmeel.__file__).parent.parent)')/cmeel.prefix" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
